# Daybook (LAYER.md): no bar, no borders, no gaps, nothing behind. One thing fills the screen
# at a time, on a workspace of its own; the page (daybook.py) is the workspace "page" and
# places every other window.
set $mod Mod4

output * bg #f4efe6 solid_color
default_border none
default_floating_border pixel 2
gaps inner 0
gaps outer 0
font pango:IBM Plex Mono 11
focus_follows_mouse no
focus_on_window_activation focus
workspace_auto_back_and_forth no

#                       border  background text    indicator child_border
client.focused          #2a2723 #f4efe6    #2a2723 #2a2723   #2a2723
client.focused_inactive #d9d1c3 #f4efe6    #8a8275 #d9d1c3   #d9d1c3
client.unfocused        #d9d1c3 #f4efe6    #8a8275 #d9d1c3   #d9d1c3
client.urgent           #a8432a #f4efe6    #a8432a #a8432a   #a8432a

for_window [app_id="^daybook$"] move container to workspace page
for_window [app_id="^raigolmi-editor$"] move container to workspace code

# Super alone and Super+` are the host's (/guide/faces.md).
bindsym $mod+space workspace page
bindsym $mod+Tab workspace back_and_forth
bindsym $mod+w [con_id=__focused__ app_id="^(?!daybook$)"] kill
bindsym $mod+Return exec foot -c /etc/face/foot.ini --app-id=thread-shell --title=shell python3 -m rai terminal

exec /etc/face/start
