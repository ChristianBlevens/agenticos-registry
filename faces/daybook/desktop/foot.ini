# Paper and ink, for every terminal on the face (the page, the editor, files, shells).
# The machine's convention (/guide/faces.md): selecting copies, right-click pastes.
[main]
font=IBM Plex Mono:size=11
selection-target=both
pad=18x14 center

[colors]
background=f4efe6
foreground=2a2723
selection-foreground=2a2723
selection-background=e6d9bd
cursor=f4efe6 a8432a
regular0=2a2723
regular1=a8432a
regular2=4f6b3a
regular3=8f6512
regular4=2f5d86
regular5=7d4a73
regular6=2f6f6a
regular7=e9e2d4
bright0=8a8275
bright1=c2573b
bright2=66854c
bright3=b07f1f
bright4=4677a3
bright5=9a5f8e
bright6=3f8a84
bright7=fbf8f2

[mouse-bindings]
select-extend=none
primary-paste=BTN_MIDDLE BTN_RIGHT
